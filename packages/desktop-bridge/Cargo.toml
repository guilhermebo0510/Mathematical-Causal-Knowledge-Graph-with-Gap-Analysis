[package]
name = "knowledge-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory"] }
