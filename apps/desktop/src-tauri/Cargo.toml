[package]
name = "knowledge-desktop"
version = "0.1.0"
description = "Local mathematical knowledge laboratory"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = "0.15.4"
tempfile = "3"
tokio = { version = "1", features = ["sync", "net"] }
uuid = { version = "=1.29.0", features = ["v4"] }
knowledge-bridge = { path = "../../../packages/desktop-bridge" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
