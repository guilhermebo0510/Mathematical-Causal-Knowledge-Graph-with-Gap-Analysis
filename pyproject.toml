[project]
name = "mathematical-knowledge-engine"
version = "0.1.0"
description = "Local, auditable verification engine for mathematical knowledge graphs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "sympy>=1.13,<2",
  "pint>=0.24,<1",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
mcp = [
    "mcp==1.28.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/engine/knowledge_engine"]

[tool.pytest.ini_options]
testpaths = ["tests/engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
